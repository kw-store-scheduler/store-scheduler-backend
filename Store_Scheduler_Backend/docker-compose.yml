# 로컬 개발용 PostgreSQL
# 실행: docker compose up -d   /   종료: docker compose down   /   데이터까지 삭제: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: scheduler-postgres
    environment:
      POSTGRES_DB: scheduler_db
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - scheduler-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scheduler-pgdata:
