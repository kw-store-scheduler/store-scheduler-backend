spring:
  application:
    name: Store_Scheduler_Backend

  # 접속 정보와 시크릿은 환경변수로 주입한다.
  # 로컬 개발 기본값은 application-local.yaml에 있으며 ./gradlew bootRun 시 자동 적용된다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.hibernate.SQL: debug

cors:
  # 추가로 허용할 웹 프론트 출처 (쉼표 구분, 예: https://app.example.com). localhost는 항상 허용
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

server:
  # 배포 플랫폼(Render 등)이 PORT 환경변수로 포트를 지정한다
  port: ${PORT:8080}

jwt:
  # 영문/숫자/특수문자 조합 32자 이상. 기본값을 두지 않아, 지정하지 않으면 기동에 실패한다.
  secret: ${JWT_SECRET}
  # 토큰 만료 시간 (밀리초, 예: 3600000 = 1시간)
  expiration_time: ${JWT_EXPIRATION_TIME:3600000}

scheduler:
  engine:
    # 파이썬 실행 명령. 가상환경을 쓰는 경우 해당 python 경로를 지정한다.
    python-command: ${PYTHON_COMMAND:python3}
    # 엔진 서버(engine-server) 주소. 지정하면 HTTP로 호출하고, 비우면 이 서버에서 파이썬 프로세스로 실행한다.
    url: ${ENGINE_URL:}
    # 엔진 서버의 ENGINE_TOKEN과 같은 값
    token: ${ENGINE_TOKEN:}
    # 엔진 응답 대기 한도(초). 솔버 time_limit보다 여유 있게 잡는다.
    timeout-seconds: ${ENGINE_TIMEOUT_SECONDS:60}
